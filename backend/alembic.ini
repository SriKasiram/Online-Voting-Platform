# Alembic settings. The database URL is deliberately not stored here:
# migrations/env.py reads it from the same environment variables as the app.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
# Split paths on the OS separator, because this project's folder names contain spaces
path_separator = os
# New migrations are named like 0002_add_something.py (pass --rev-id 0002)
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
