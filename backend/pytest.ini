[pytest]
testpaths = tests
# Lets the tests import app and scripts without installing the backend as a package
pythonpath = .
addopts = -ra
# SR-16: the capture tests (one real action per audit category) run on their own with
# pytest -m audit_capture: monthly in .github/workflows/audit-capture.yml, and before each release
markers =
    audit_capture: SR-16 audit capture test, run monthly and before each release
