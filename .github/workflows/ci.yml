name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: evoting
          # Throwaway container that exists only for this job, so this is not a secret
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: evoting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evoting -d evoting"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: evoting
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: evoting
      POSTGRES_TEST_DB: evoting_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests (migrations, seed, API, schema)
        run: pytest

  # Added in later stages:
  #   backend:  bandit, pip-audit
  #   secrets:  gitleaks scan of the full history
  #   codeql:   CodeQL analysis for Python and TypeScript
